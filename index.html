<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiosco Pastaza</title>
<style>
  :root { --pri: #1b5e20; --sec: #ff9800; --bg: #f1f8e9; --dark: #1a1a1a; }
  * { box-sizing: border-box; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--dark); padding-bottom: 85px; }
  header { background: var(--pri); color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .nav-btn { background: var(--sec); color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; }
  .cats { display: flex; gap: 8px; padding: 12px; overflow-x: auto; background: #fff; }
  .cat { padding: 8px 14px; border-radius: 20px; border: 1px solid #ccc; background: #fff; font-weight: bold; white-space: nowrap; }
  .cat.active { background: var(--pri); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; padding: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
  .emoji { font-size: 2.5rem; }
  .desc { font-size: 0.75rem; color: #555; margin: 4px 0; }
  .price { color: var(--pri); font-weight: bold; font-size: 1.1rem; margin: 4px 0; }
  .btn-add { background: var(--sec); border: none; padding: 9px; border-radius: 8px; font-weight: bold; width: 100%; }
  .cart-bar { position: fixed; bottom: 0; width: 100%; background: var(--dark); color: #fff; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
  .btn-pay { background: #25d366; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); justify-content: center; align-items: center; z-index: 20; padding: 15px; }
  .modal-box { background: #fff; padding: 16px; border-radius: 12px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
  .opt-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  input, select { width: 100%; padding: 9px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; }
  .dash { display: none; padding: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat-card { background: #fff; padding: 10px; border-radius: 10px; text-align: center; }
  .order-card { background: #fff; padding: 12px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--sec); }
  .order-card.listo { border-left-color: #25d366; opacity: 0.7; }
  .p-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: #e8f5e9; display: block; }
  .card { position: relative; }
  .cam-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 0.95rem; cursor: pointer; z-index: 2; }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; } }
  @media print { body * { visibility: hidden; } #printZone, #printZone * { visibility: visible; } #printZone { position: absolute; left: 0; top: 0; width: 100%; font-family: monospace; font-size: 14px; } }
</style>
</head>
<body>
<header>
  <h3>🌴 Sabor Pastaza</h3>
  <button class="nav-btn" onclick="toggleView()" id="btnView">👨‍🍳 Caja / Cocina</button>
</header>

<div id="kioscoView">
  <div class="cats" id="cats"></div>
  <div class="grid" id="menuGrid"></div>
  <div class="cart-bar">
    <div>
      <small id="cartCount">0 productos</small>
      <div style="font-size:1.2rem;font-weight:bold;" id="cartTotal">$0.00</div>
    </div>
    <button class="btn-pay" onclick="openCheckout()">Cobrar ➡️</button>
  </div>
</div>

<div id="dashView" class="dash">
  <div class="stats">
    <div class="stat-card"><small>Total Caja</small><h3 id="statSales">$0.00</h3></div>
    <div class="stat-card"><small>Efectivo</small><h3 id="statCash">$0.00</h3></div>
    <div class="stat-card"><small>DeUna/Transf</small><h3 id="statDigital">$0.00</h3></div>
  </div>
  <button class="btn-add" style="background:#ddd;margin-bottom:12px;" onclick="exportCSV()">📊 Descargar Excel (CSV)</button><button class="btn-add" style="background:#90caf9;margin-bottom:8px;" onclick="printClose()">🖨️ Imprimir Cierre</button><button class="btn-add" style="background:#ddd;margin-bottom:12px;" onclick="clearOrders()">🗑️ Cerrar Caja / Reiniciar</button>
  <div id="ordersList"></div>
</div>
<div class="modal" id="comboModal"><div class="modal-box"><h3 id="mTitle"></h3><p id="mDesc" style="font-size:0.85rem;color:#444;margin:4px 0;"></p><p id="mBasePrice" style="color:#1b5e20;font-weight:bold;margin-bottom:8px;"></p><div id="dynOpts"></div><input type="text" id="optNote" placeholder="Nota..."><div style="display:flex;gap:8px;margin-top:12px;"><button class="btn-add" style="background:#ccc;" onclick="closeModals()">Cancelar</button><button class="btn-add" onclick="confirmItem()">Agregar</button></div></div></div><div class="modal" id="payModal">
  <div class="modal-box">
    <h3>🧾 Resumen y Caja</h3>
    <div id="cartItems" style="max-height:140px;overflow-y:auto;margin:6px 0;"></div>
    <input type="text" id="custName" placeholder="Nombre del Cliente o Mesa">
    <select id="cashierName">
      <option value="Kiosco Autoservicio">📱 Kiosco Autoservicio</option>
      <option value="Caja 1 (Principal)">🧑‍💼 Caja 1 (Principal)</option>
      <option value="Caja 2 (Rápida)">🧑‍💼 Caja 2 (Rápida)</option>
    </select>
    <select id="orderType">
      <option value="Para Servirse">🍽️ Para Servirse Aquí</option>
      <option value="Para Llevar">🛍️ Para Llevar (Tarrina)</option>
    </select>
    <select id="payMethod" onchange="toggleCashCalc()">
      <option value="Efectivo">💵 Efectivo</option>
      <option value="DeUna / Transferencia">📲 DeUna / Transferencia</option>
    </select>
    <div id="cashBox" style="background:#f9f9f9;padding:8px;border-radius:8px;margin-top:4px;">
      <small>Billete recibido ($):</small>
      <input type="number" id="cashGiven" placeholder="Ej: 10.00" oninput="calcChange()">
      <div id="changeTxt" style="font-weight:bold;color:#1b5e20;">Vuelto: $0.00</div>
    </div>
    <h3 id="finalTotal" style="margin:10px 0;text-align:right;">Total: $0.00</h3>
    <div style="display:flex;gap:8px;">
      <button class="btn-add" style="background:#ccc;" onclick="closeModals()">Volver</button>
      <button class="btn-pay" style="width:100%;" onclick="sendOrder()">✅ Cobrar y Enviar</button>
    </div>
  </div>
</div>
<script>
const whatsappNum = "593996348376";
const defaultPics = {
  1: "fotos/1.jpg.JPG", 2: "fotos/2.jpg.JPG", 3: "fotos/3.jpg.JPG",
  4: "fotos/4.jpg.JPG", 5: "fotos/5.jpg.JPG", 6: "fotos/6.jpg.JPG",
  7: "fotos/7.jpg.JPG", 8: "fotos/8.jpg.JPG", 9: "fotos/9.jpg.JPG"
};
let savedPics = JSON.parse(localStorage.getItem("pastaza_pics") || "{}");
const products = [
  { id: 1, cat: "Amazónicos", name: "Maito de Tilapia", desc: "Tilapia asada en hoja de bijao con yuca, palmito y curtido.", price: 5.50, cost: 2.40, opts: [{n:"🥤 Combo (+Guayusa/Yuca)", p:1.75}, {n:"🌿 Extra Palmito", p:1.25}, {n:"🌶️ Ají de Cocona", p:0, def:true}] },
  { id: 2, cat: "Amazónicos", name: "Pinchos Chontacuro", desc: "1 pincho con 3 chontacuros asados al carbón, yuca y sal prieta.", price: 4.00, cost: 1.80, opts: [{n:"🐛 +2 Chontacuros", p:2.50}, {n:"🍌 Maduro c/Queso", p:1.25}, {n:"🌶️ Ají de Maní", p:0, def:true}] },
  { id: 3, cat: "Amazónicos", name: "Volquetero Pastacense", desc: "Chocho, tostado, chifle crocante, atún, tomate y limón.", price: 3.50, cost: 1.40, opts: [{n:"🐟 Extra Atún", p:1.50}, {n:"🍌 Extra Chifle", p:0.75}, {n:"🌶️ Con Ají", p:0, def:true}] },
  { id: 4, cat: "Rápida", name: "Burger Amazónica", desc: "Carne artesanal, queso cheddar, maduro y salsa de cocona.", price: 4.50, cost: 2.00, opts: [{n:"🍟 Combo (+Papas/Cola)", p:2.25}, {n:"🥩 Doble Carne", p:1.75}, {n:"🧀 Extra Queso", p:0.75}] },
  { id: 5, cat: "Rápida", name: "Salchipapa Chicharrón", desc: "Papa nativa frita, salchicha ranchera y chicharrón.", price: 3.75, cost: 1.60, opts: [{n:"🥓 Extra Chicharrón", p:1.50}, {n:"🍳 Huevo Frito", p:0.75}, {n:"🥫 Todas las salsas", p:0, def:true}] },
  { id: 6, cat: "Rápida", name: "Bolón Mixto c/ Seco", desc: "Verde majado con queso, chicharrón y jugo de seco.", price: 3.25, cost: 1.35, opts: [{n:"☕ Combo (+Café)", p:1.00}, {n:"🍳 Huevo Frito", p:0.75}, {n:"🍖 Extra Jugo Seco", p:0.50}] },
  { id: 7, cat: "Bebidas", name: "Jarra Guayusa Helada", desc: "Infusión amazónica con limón sutil y panela.", price: 1.50, cost: 0.45 },
  { id: 8, cat: "Bebidas", name: "Chicha de Chonta", desc: "Bebida tradicional dulce y refrescante bien fría.", price: 1.25, cost: 0.40 },
  { id: 9, cat: "Bebidas", name: "Jugo de Cocona", desc: "Jugo 100% natural recién licuado de fruta amazónica.", price: 1.50, cost: 0.45 }
];
let currentCat = "Todas", cart = [], selectedProd = null, currentTotal = 0;
let orders = JSON.parse(localStorage.getItem("pastaza_orders") || "[]");

function init() {
  const cats = ["Todas", ...new Set(products.map(p => p.cat))];
  document.getElementById("cats").innerHTML = cats.map(c => 
    `<button class="cat ${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
  renderMenu();
}

function setCat(c) { currentCat = c; 
function cancelOrder(i) {
  let motivo = prompt("¿Motivo de anulación? (Ej: Error de cajero, cliente canceló):");
  if (motivo === null) return;
  orders[i].status = "Anulado ❌";
  orders[i].motivo = motivo || "Sin motivo";
  localStorage.setItem("pastaza_orders", JSON.stringify(orders));
  renderDash();
}
function exportCSV() {
  if (!orders.length) return alert("Sin ventas");
  let csv = "Turno,Hora,Cliente,Cajero,Tipo,Pago,Productos,Venta ($),Costo ($),Ganancia ($),Estado,Motivo\n", sv=0, sc=0, sg=0, an=0;
  orders.forEach(o => {
    let pr = o.items.map(i => i.name + (i.details ? " ("+i.details+")" : "")).join(" + ");
    let c = o.items.reduce((s, i) => s + (i.finalCost || o.total * 0.4), 0), g = o.total - c;
    if (o.status !== "Anulado ❌") { sv += o.total; sc += c; sg += g; } else { an++; }
    csv += `${o.turno},${o.time},"${o.name}","${o.cashier}","${o.type}","${o.pay}","${pr}",${o.total.toFixed(2)},${c.toFixed(2)},${g.toFixed(2)},"${o.status}","${o.motivo||""}"\n`;
  });
  csv += `\nRESUMEN,,,,,,Validas: ${orders.length-an} | Anuladas: ${an},${sv.toFixed(2)},${sc.toFixed(2)},${sg.toFixed(2)},,\n`;
  let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"}));
  a.download = "Reporte_Pastaza_" + new Date().toISOString().slice(0,10) + ".csv"; a.click();
}
function printClose() {
  let v = orders.filter(o => o.status !== "Anulado ❌"), tot = v.reduce((s, o) => s + o.total, 0), cash = v.filter(o => o.pay === "Efectivo").reduce((s, o) => s + o.total, 0);
  let pz = document.getElementById("printZone"); pz.style.display = "block";
  pz.innerHTML = `<pre>CIERRE DIARIO - SABOR PASTAZA\nFecha: ${new Date().toLocaleDateString()}\n-----------------------\nValidas: ${v.length} | Anuladas: ${orders.length-v.length}\nEfectivo: $${cash.toFixed(2)}\nDeUna/Transf: $${(tot-cash).toFixed(2)}\nTOTAL CAJA: $${tot.toFixed(2)}</pre>`;
  setTimeout(() => { window.print(); pz.style.display = "none"; }, 200);
}
function printTicket(i) {
  let o = orders[i], pz = document.getElementById("printZone"); pz.style.display = "block";
  pz.innerHTML = `<pre>SABOR PASTAZA EXPRESS\n-----------------------\nTURNO: #${o.turno} (${o.time})\nCliente: ${o.name} | ${o.type}\nCajero: ${o.cashier} | ${o.pay}\n-----------------------\n${o.items.map(it => "- "+it.name+" $"+it.finalPrice.toFixed(2)+(it.details?"\n  "+it.details:"")).join("\n")}\n-----------------------\nTOTAL: $${o.total.toFixed(2)}</pre>`;
  setTimeout(() => { window.print(); pz.style.display = "none"; }, 200);
}
init(); }

function renderMenu() {
  const list = currentCat === "Todas" ? products : products.filter(p => p.cat === currentCat);
  document.getElementById("menuGrid").innerHTML = list.map(p => {
    let pic = savedPics[p.id] || defaultPics[p.id];
    return `<div class="card">
      <button class="cam-btn" onclick="uploadPic(${p.id})" title="Cambiar foto">📷</button>
      <div><img src="${pic}" class="p-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\"http://w3.org\" width=\"300\" height=\"200\"><rect width=\"100%\" height=\"100%\" fill=\"%23e8f5e9\"/></svg><b>${p.name}</b><div class="desc">${p.desc}</div></div>
      <div><div class="price">$${p.price.toFixed(2)}</div><button class="btn-add" onclick="selectItem(${p.id})">+ Agregar</button></div>
    </div>`;
  }).join("");
}
function uploadPic(id) {
  let inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.onchange = e => {
    let f = e.target.files[0]; if (!f) return;
    let r = new FileReader();
    r.onload = ev => {
      let img = new Image();
      img.onload = () => {
        let c = document.createElement("canvas");
        c.width = 600; c.height = 450;
        c.getContext("2d").drawImage(img, 0, 0, 600, 450);
        savedPics[id] = c.toDataURL("image/jpeg", 0.85);
        localStorage.setItem("pastaza_pics", JSON.stringify(savedPics));
        renderMenu();
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function selectItem(id) {
  selectedProd = products.find(p => p.id === id);
  if (!selectedProd.opts) { cart.push({ ...selectedProd, finalPrice: selectedProd.price, finalCost: selectedProd.cost || 0, details: "" }); updateCart(); return; }
  document.getElementById("mTitle").innerText = selectedProd.name;
  document.getElementById("mDesc").innerText = selectedProd.desc;
  document.getElementById("mBasePrice").innerText = `Base: $${selectedProd.price.toFixed(2)}`;
  document.getElementById("dynOpts").innerHTML = selectedProd.opts.map((o, i) => `<div class="opt-row"><label><input type="checkbox" class="dyn-chk" data-i="${i}" ${o.def?"checked":""}> ${o.n}</label><b>${o.p>0?"+$"+o.p.toFixed(2):"Gratis"}</b></div>`).join("");
  document.getElementById("optNote").value = ""; document.getElementById("comboModal").style.display = "flex";
}
function confirmItem() {
  let ex = 0, det = [];
  document.querySelectorAll(".dyn-chk:checked").forEach(c => { let o = selectedProd.opts[c.dataset.i]; ex += o.p; det.push(o.n); });
  const n = document.getElementById("optNote").value.trim(); if (n) det.push("Nota: "+n);
  cart.push({ ...selectedProd, finalPrice: selectedProd.price + ex, finalCost: (selectedProd.cost || 0) + (ex * 0.4), details: det.join(", ") });
  closeModals(); updateCart();
}
function updateCart() {
  currentTotal = cart.reduce((s, i) => s + i.finalPrice, 0);
  document.getElementById("cartCount").innerText = `${cart.length} producto(s)`;
  document.getElementById("cartTotal").innerText = `$${currentTotal.toFixed(2)}`;
}

function openCheckout() {
  if (!cart.length) return alert("Agrega productos primero");
  document.getElementById("cartItems").innerHTML = cart.map((item, idx) => `
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;">
      <div><b>${item.name}</b><br><small style="color:#666">${item.details}</small></div>
      <div>$${item.finalPrice.toFixed(2)} <button onclick="remItem(${idx})" style="color:red;border:none;background:none;font-weight:bold;">✕</button></div>
    </div>
  `).join("");
  document.getElementById("finalTotal").innerText = `Total: $${currentTotal.toFixed(2)}`;
  document.getElementById("cashGiven").value = ""; document.getElementById("changeTxt").innerText = "Vuelto: $0.00";
  document.getElementById("payModal").style.display = "flex";
}
function toggleCashCalc() { document.getElementById("cashBox").style.display = document.getElementById("payMethod").value === "Efectivo" ? "block" : "none"; }
function calcChange() {
  const diff = (parseFloat(document.getElementById("cashGiven").value) || 0) - currentTotal;
  document.getElementById("changeTxt").innerText = diff >= 0 ? `Vuelto: $${diff.toFixed(2)}` : `Falta: $${Math.abs(diff).toFixed(2)}`;
}
function remItem(idx) { cart.splice(idx, 1); updateCart(); cart.length ? openCheckout() : closeModals(); }
function closeModals() { document.querySelectorAll(".modal").forEach(m => m.style.display = "none"); }

function sendOrder() {
  const name = document.getElementById("custName").value.trim() || "Cliente", cashier = document.getElementById("cashierName").value;
  const type = document.getElementById("orderType").value, pay = document.getElementById("payMethod").value, turno = orders.length + 101;
  orders.unshift({ turno, name, cashier, type, pay, items: [...cart], total: currentTotal, status: "En Cocina 🍳", time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
  localStorage.setItem("pastaza_orders", JSON.stringify(orders));
  let msg = `*🌴 PEDIDO #${turno}* (${type})\n👤 *Cliente:* ${name}\n🧑‍💼 *Cajero:* ${cashier}\n💳 *Pago:* ${pay}\n\n`;
  cart.forEach(i => msg += `▪️ ${i.name} ($${i.finalPrice.toFixed(2)})${i.details ? `\n   _${i.details}_` : ""}\n`);
  msg += `\n*TOTAL: $${currentTotal.toFixed(2)}*`;
  cart = []; updateCart(); closeModals();
  alert(`¡Orden #${turno} registrada!`);
  window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, "_blank");
}

function toggleView() {
  const k = document.getElementById("kioscoView"), d = document.getElementById("dashView"), btn = document.getElementById("btnView");
  if (d.style.display === "block") { d.style.display = "none"; k.style.display = "block"; btn.innerText = "👨‍🍳 Caja / Cocina"; }
  else { k.style.display = "none"; d.style.display = "block"; btn.innerText = "🌴 Ver Menú"; renderDash(); }
}

function renderDash() {
  const total = orders.filter(o => o.status !== "Anulado ❌").reduce((s, o) => s + o.total, 0), cash = orders.filter(o => o.pay === "Efectivo" && o.status !== "Anulado ❌").reduce((s, o) => s + o.total, 0);
  document.getElementById("statSales").innerText = `$${total.toFixed(2)}`;
  document.getElementById("statCash").innerText = `$${cash.toFixed(2)}`;
  document.getElementById("statDigital").innerText = `$${(total - cash).toFixed(2)}`;
  document.getElementById("ordersList").innerHTML = orders.map((o, i) => `
    <div class="order-card ${o.status.includes('Listo')?'listo':''}">
      <div style="display:flex;justify-content:space-between;<b>Turno #${o.turno} - ${o.name}</b><span>${o.time}</span></div>
      <small>${o.cashier} | ${o.type} | <b>${o.pay}</b></small>
      <div style="margin:6px 0;font-size:0.9rem;">${o.items.map(it => `• ${it.name} <small>(${it.details})</small>`).join("<br>")}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;<b>Total: $${o.total.toFixed(2)}</b>
      <div>
${o.status === 'Anulado ❌' ? '<span style="color:red;font-weight:bold;">❌ Anulado</span>' : (!o.status.includes('Listo') ? `<button class="btn-pay" style="padding:5px 8px;font-size:0.8rem;" onclick="markDone(${i})">✅ Despachar</button>` : '<span>✅ Entregado</span>')}
<button onclick="printTicket(${i})" style="padding:5px 8px;border-radius:6px;border:1px solid #ccc;margin-left:4px;">🖨️</button>
${o.status !== 'Anulado ❌' ? `<button onclick="cancelOrder(${i})" style="padding:5px 8px;border-radius:6px;border:none;background:#ffebee;color:#c62828;font-weight:bold;margin-left:4px;">❌</button>` : ''}
</div></div>
    </div>
  `).join("") || "<p>Sin ventas hoy.</p>";
}

function markDone(i) { orders[i].status = "Listo ✅"; localStorage.setItem("pastaza_orders", JSON.stringify(orders)); renderDash(); }
function clearOrders() { if(confirm("¿Cerrar caja y reiniciar turnos?")) { orders = []; localStorage.removeItem("pastaza_orders"); renderDash(); } }

function cancelOrder(i) {
  let motivo = prompt("¿Motivo de anulación? (Ej: Error de cajero, cliente canceló):");
  if (motivo === null) return;
  orders[i].status = "Anulado ❌";
  orders[i].motivo = motivo || "Sin motivo";
  localStorage.setItem("pastaza_orders", JSON.stringify(orders));
  renderDash();
}
function exportCSV() {
  if (!orders.length) return alert("Sin ventas");
  let csv = "Turno,Hora,Cliente,Cajero,Tipo,Pago,Productos,Venta ($),Costo ($),Ganancia ($),Estado,Motivo\n", sv=0, sc=0, sg=0, an=0;
  orders.forEach(o => {
    let pr = o.items.map(i => i.name + (i.details ? " ("+i.details+")" : "")).join(" + ");
    let c = o.items.reduce((s, i) => s + (i.finalCost || o.total * 0.4), 0), g = o.total - c;
    if (o.status !== "Anulado ❌") { sv += o.total; sc += c; sg += g; } else { an++; }
    csv += `${o.turno},${o.time},"${o.name}","${o.cashier}","${o.type}","${o.pay}","${pr}",${o.total.toFixed(2)},${c.toFixed(2)},${g.toFixed(2)},"${o.status}","${o.motivo||""}"\n`;
  });
  csv += `\nRESUMEN,,,,,,Validas: ${orders.length-an} | Anuladas: ${an},${sv.toFixed(2)},${sc.toFixed(2)},${sg.toFixed(2)},,\n`;
  let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"}));
  a.download = "Reporte_Pastaza_" + new Date().toISOString().slice(0,10) + ".csv"; a.click();
}
function printClose() {
  let v = orders.filter(o => o.status !== "Anulado ❌"), tot = v.reduce((s, o) => s + o.total, 0), cash = v.filter(o => o.pay === "Efectivo").reduce((s, o) => s + o.total, 0);
  let pz = document.getElementById("printZone"); pz.style.display = "block";
  pz.innerHTML = `<pre>CIERRE DIARIO - SABOR PASTAZA\nFecha: ${new Date().toLocaleDateString()}\n-----------------------\nValidas: ${v.length} | Anuladas: ${orders.length-v.length}\nEfectivo: $${cash.toFixed(2)}\nDeUna/Transf: $${(tot-cash).toFixed(2)}\nTOTAL CAJA: $${tot.toFixed(2)}</pre>`;
  setTimeout(() => { window.print(); pz.style.display = "none"; }, 200);
}
function printTicket(i) {
  let o = orders[i], pz = document.getElementById("printZone"); pz.style.display = "block";
  pz.innerHTML = `<pre>SABOR PASTAZA EXPRESS\n-----------------------\nTURNO: #${o.turno} (${o.time})\nCliente: ${o.name} | ${o.type}\nCajero: ${o.cashier} | ${o.pay}\n-----------------------\n${o.items.map(it => "- "+it.name+" $"+it.finalPrice.toFixed(2)+(it.details?"\n  "+it.details:"")).join("\n")}\n-----------------------\nTOTAL: $${o.total.toFixed(2)}</pre>`;
  setTimeout(() => { window.print(); pz.style.display = "none"; }, 200);
}
init();
</script>
<div id="printZone" style="display:none;"></div></body>
</html>
