<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabor Pastaza Express</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
  body{background:#f1f8e9;color:#1b5e20;padding-bottom:80px}
  header{background:#1b5e20;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .btn-top{background:#ffb300;color:#000;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer}
  .cats{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#e8f5e9}
  .cat{padding:6px 14px;border-radius:20px;border:1px solid #1b5e20;background:#fff;color:#1b5e20;font-weight:600;white-space:nowrap}
  .cat.active{background:#1b5e20;color:#fff}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
  @media(min-width:768px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
  .card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 6px rgba(0,0,0,0.08);display:flex;flex-direction:column;justify-content:space-between}
  .p-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin-bottom:6px;background:#e8f5e9;display:block}
  .desc{font-size:0.78rem;color:#555;margin:4px 0}
  .price{font-weight:bold;font-size:1.05rem;margin:4px 0}
  .btn-add{width:100%;background:#2e7d32;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:bold;cursor:pointer}
  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:#1b5e20;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .btn-pay{background:#ffb300;color:#000;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;padding:16px;z-index:20}
  .modal-box{background:#fff;padding:16px;border-radius:12px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto}
  .opt-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
  input,select{width:100%;padding:8px;margin-top:8px;border:1px solid #ccc;border-radius:8px}
  .dash{padding:12px;display:none}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:#fff;padding:10px;border-radius:10px;text-align:center}
  .order-card{background:#fff;padding:12px;border-radius:10px;margin-bottom:10px;border-left:5px solid #ff9800}
  .order-card.listo{border-left-color:#2e7d32}
  @media print{header,#kioscoView,#dashView,.cart-bar,.modal{display:none!important}#printZone{display:block!important;font-family:monospace;font-size:14px;color:#000;background:#fff;padding:12px}}
</style>
</head>
<body>
<header><h3>🌴 Sabor Pastaza</h3><button class="btn-top" id="toggleBtn" onclick="toggleView()">👨‍🍳 Caja / Cocina</button></header>
<div id="kioscoView">
  <div class="cats" id="catBar"></div>
  <div class="grid" id="menuGrid"></div>
  <div class="cart-bar"><div><b id="cartCount">0 items</b> • <span id="cartTotal">$0.00</span></div><button class="btn-pay" onclick="openPay()">Cobrar ➔</button></div>
</div>
<div class="dash" id="dashView">
  <div class="stats">
    <div class="stat"><small>Total Caja</small><h3 id="dTotal">$0.00</h3></div>
    <div class="stat"><small>Efectivo</small><h3 id="dCash">$0.00</h3></div>
    <div class="stat"><small>DeUna/Transf</small><h3 id="dBank">$0.00</h3></div>
  </div>
  <button class="btn-add" style="background:#2e7d32;margin-bottom:8px;" onclick="exportCSV()">📊 Descargar Excel (CSV)</button>
  <button class="btn-add" style="background:#90caf9;color:#000;margin-bottom:8px;" onclick="printClose()">🖨️ Imprimir Cierre</button>
  <button class="btn-add" style="background:#ddd;color:#000;margin-bottom:12px;" onclick="clearOrders()">🗑️ Cerrar Caja / Reiniciar</button>
  <div id="ordersList"></div>
</div>
<div class="modal" id="comboModal"><div class="modal-box"><h3 id="mTitle"></h3><p id="mDesc" class="desc"></p><p id="mBasePrice" class="price"></p><div id="dynOpts"></div><input type="text" id="optNote" placeholder="Nota (Ej: Sin cebolla...)"><div style="display:flex;gap:8px;margin-top:12px;"><button class="btn-add" style="background:#ccc;color:#000;" onclick="closeModals()">Cancelar</button><button class="btn-add" onclick="confirmItem()">Agregar</button></div></div></div>
<div class="modal" id="payModal"><div class="modal-box"><h3>Finalizar Orden</h3><div id="cartSummary" style="margin:8px 0;font-size:0.9rem;"></div><input type="text" id="custName" placeholder="Nombre del Cliente"><select id="cashier"><option>Caja 1 - Principal</option><option>Caja 2 - Express</option></select><select id="orderType"><option>Para Servirse</option><option>Para Llevar</option><option>Delivery</option></select><select id="payMethod" onchange="calcChange()"><option>Efectivo</option><option>DeUna / Banco Pichincha</option><option>Transferencia</option></select><div id="cashBox"><input type="number" step="0.01" id="cashGiven" placeholder="Efectivo recibido ($)" oninput="calcChange()"><p id="changeTxt" style="margin-top:6px;font-weight:bold;">Vuelto: $0.00</p></div><div style="display:flex;gap:8px;margin-top:12px;"><button class="btn-add" style="background:#ccc;color:#000;" onclick="closeModals()">Volver</button><button class="btn-pay" style="width:100%;" onclick="finishOrder()">✅ Confirmar y WhatsApp</button></div></div></div>
<div id="printZone" style="display:none;"></div>
